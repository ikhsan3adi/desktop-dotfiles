<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family">
      <string>RecMonoCasualNerdFontMono-SwaylockBold</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>RecMonoCasual Nerd Font Mono</string>
    </edit>
    <edit name="weight" mode="assign" binding="same">
      <const>bold</const>
    </edit>
  </match>
</fontconfig>
